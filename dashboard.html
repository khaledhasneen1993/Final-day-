<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Final Day | لوحة الإشارات</title>
<style>
:root{color-scheme:dark;--bg:#0a101b;--panel:#111b2b;--line:#243249;--text:#edf3ff;--muted:#a2b0c6;--green:#6df0c2;--red:#ff9ba7;--blue:#91b8ff}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top right,#142840 0%,var(--bg) 46%);color:var(--text);font:15px/1.6 "Inter",Tahoma,Arial,sans-serif}main{max-width:1440px;margin:auto;padding:28px clamp(14px,4vw,58px) 52px}header,.section-head,.identity,.controls{display:flex;align-items:center;gap:12px;flex-wrap:wrap}header,.section-head{justify-content:space-between}header{border-bottom:1px solid var(--line);padding-bottom:20px}.mark{display:grid;place-items:center;width:44px;height:44px;border:1px solid #376d6d;border-radius:12px;color:var(--green);background:#173235;font-weight:800;letter-spacing:.04em}.brand{font-size:20px;font-weight:750;line-height:1.15}.subtitle,small{color:var(--muted)}.pills{display:flex;gap:8px;flex-wrap:wrap}.pill{display:inline-flex;align-items:center;gap:7px;padding:4px 10px;border:1px solid var(--line);border-radius:100px;font-size:12px;color:var(--muted)}.pill:before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}.good{color:var(--green)}.bad{color:var(--red)}.neutral{color:var(--blue)}.title{margin:25px 0 18px}h1{font-size:clamp(25px,4vw,38px);margin:0;line-height:1.3}h2{font-size:18px;margin:0}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.card,.panel{background:var(--panel);border:1px solid var(--line);border-radius:15px}.card{padding:13px 16px}.card strong{display:block;font-size:30px;font-variant-numeric:tabular-nums;line-height:1.3}.card span{font-size:13px;color:var(--muted)}nav{display:flex;gap:7px;margin:22px 0 12px;flex-wrap:wrap}button,input{font:inherit;color:inherit;background:#101a29;border:1px solid var(--line);border-radius:8px;padding:7px 12px}button{cursor:pointer}button[aria-selected=true]{background:#203451;color:#dceaff;border-color:#45658c}button:disabled{opacity:.4;cursor:default}input{min-width:0;width:185px}button:focus-visible,input:focus-visible{outline:2px solid var(--blue);outline-offset:2px}.section-head{padding:15px 17px}.scroll{overflow:auto;border-top:1px solid var(--line)}table{border-collapse:collapse;width:100%;white-space:nowrap;text-align:right;font-variant-numeric:tabular-nums}th,td{padding:10px 13px;border-bottom:1px solid #202d41}th{color:var(--muted);font-weight:500;background:#101827;font-size:12px}td{font-size:13px}tbody tr:hover{background:#18273c}.pair{font-weight:700;color:#e1ecff}.empty{text-align:center;color:var(--muted);padding:32px}footer{padding:12px 16px;color:var(--muted);display:flex;align-items:center;gap:9px}bdi{unicode-bidi:isolate}.details{white-space:normal;min-width:155px}.details summary{cursor:pointer;color:var(--blue)}.details div{color:var(--muted);padding-top:4px}#error{color:var(--red);margin:12px 0}.caption{margin:0;color:var(--muted);font-size:12px}@media(max-width:620px){main{padding-top:16px}.cards{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.card{padding:10px 12px}.card strong{font-size:24px}th,td{padding:8px 9px}.section-head{padding:12px}}
</style>
</head>
<body>
<main>
<header>
  <div class="identity"><div class="mark" dir="ltr">FD</div><div><div class="brand" dir="ltr">Final Day</div><small>Binance USDT-M</small></div></div>
  <div class="pills"><span id="market" class="pill">بانتظار السوق</span><span id="link" class="pill">جارٍ التحديث</span></div>
</header>
<div class="title"><h1>لوحة الإشارات</h1><p class="caption">مراقبة السوق وتتبع إشارات Telegram افتراضيًا.</p></div>
<div class="cards">
  <div class="card"><span>عقود قيد المراقبة</span><strong id="watched">—</strong></div>
  <div class="card"><span>صفقات متابعة مفتوحة</span><strong id="opened" class="neutral">—</strong></div>
  <div class="card"><span>وصلت للهدف</span><strong id="target" class="good">—</strong></div>
  <div class="card"><span>وصلت للستوب</span><strong id="stop" class="bad">—</strong></div>
</div>
<p id="error" role="status" hidden>انقطع الاتصال باللوحة. تُعرض آخر بيانات مستلمة.</p>
<nav aria-label="أقسام اللوحة">
  <button type="button" data-view="watch" aria-selected="true">قائمة المراقبة</button>
  <button type="button" data-view="open" aria-selected="false">الصفقات المفتوحة</button>
  <button type="button" data-view="closed" aria-selected="false">سجل الإغلاقات</button>
</nav>
<section class="panel">
  <div class="section-head"><div><h2 id="heading">العقود قيد القراءة</h2><p class="caption" id="note"></p></div><label>بحث <input type="search" id="search" placeholder="مثال BTC"></label></div>
  <div class="scroll"><table><thead><tr id="columns"></tr></thead><tbody id="rows"></tbody></table></div>
  <footer><small id="updated">بانتظار البيانات</small><span id="pager" hidden><button id="prev" type="button">السابق</button> <span id="page"></span> <button id="next" type="button">التالي</button></span></footer>
</section>
</main>
<script>
const el = id => document.getElementById(id);
const labels = {
  watch: ['العقود قيد القراءة', 'السعر، الحركة خلال دقيقتين، والحجم مقارنة بمتوسطه. يُفحص الدفتر بعد تحقق شرطَي الحركة والحجم.', ['العقد','السعر','حركة دقيقتين','الحجم','اختلال الدفتر','البيانات']],
  open: ['صفقات المتابعة المفتوحة', 'تُفتح افتراضيًا بعد تأكيد Telegram. تُرصد الأسعار كل 5 ثوانٍ تقريبًا.', ['العقد','الاتجاه','الدخول','آخر سعر','الستوب','الهدف','حركة الصفقة','وقت الإشارة','تفاصيل']],
  closed: ['سجل الإغلاقات', 'الإغلاق بسعر السوق المرصود عند تحقق الهدف أو الستوب. البحث يفلتر الصفحة الحالية.', ['العقد','الاتجاه','الدخول','الخروج','الستوب','الهدف','النتيجة','وقت الإشارة','وقت الإغلاق','تفاصيل']]
};
let view = 'watch', page = 1, data, busy = false;
const price = value => value == null ? '—' : Number(value.toPrecision(12)).toString();
const percent = value => value == null ? '—' : (value > 0 ? '+' : '') + (value * 100).toFixed(2) + '%';
const ratio = value => value == null ? '—' : value.toFixed(2) + '×';
const stamp = value => value == null ? '—' : new Date(value * 1000).toLocaleString('ar-JO');
const tone = value => value > 0 ? 'good' : value < 0 ? 'bad' : '';
const symbol = value => value.split(':')[0];
function cell(row, value, cls) {
  const td = row.insertCell();
  if (cls) td.className = cls;
  const bdi = document.createElement('bdi');
  bdi.textContent = value;
  td.append(bdi);
  return td;
}
function render() {
  const [title, note, headings] = labels[view];
  el('heading').textContent = title;
  el('note').textContent = note;
  el('columns').replaceChildren(...headings.map(text => Object.assign(document.createElement('th'), {textContent: text})));
  const fragment = document.createDocumentFragment();
  const list = !data ? [] : view === 'watch' ? data.market.symbols : data.trades[view];
  const query = el('search').value.trim().toUpperCase();
  for (const item of list.filter(row => symbol(row.symbol).toUpperCase().includes(query))) {
    const row = document.createElement('tr');
    cell(row, symbol(item.symbol), 'pair');
    if (view === 'watch') {
      const m = item.metrics;
      cell(row, price(m?.price));
      cell(row, percent(m?.ret), tone(m?.ret));
      cell(row, ratio(m?.spike));
      cell(row, item.imbalance == null ? '—' : item.imbalance.toFixed(2));
      cell(row, item.fresh ? 'مباشر' : m ? 'متأخر' : 'قيد التحميل', item.fresh ? 'good' : '');
    } else {
      cell(row, item.side === 'buy' ? 'Long' : 'Short', item.side === 'buy' ? 'good' : 'bad');
      cell(row, price(item.entry));
      const stale = view === 'open' && item.price_at != null && data.time - item.price_at > 15;
      cell(row, price(item.price) + (stale ? ' · متأخر' : ''));
      cell(row, price(item.stop));
      cell(row, price(item.target));
      cell(row, view === 'open' ? percent(item.change) : item.status.toUpperCase() + ' · ' + percent(item.change), tone(item.change));
      cell(row, stamp(item.opened));
      if (view === 'closed') cell(row, stamp(item.closed));
      const td = row.insertCell();
      const details = document.createElement('details');
      details.className = 'details';
      const summary = Object.assign(document.createElement('summary'), {textContent:'شروط الإشارة'});
      details.append(summary);
      for (const text of ['الحركة ' + percent(item.movement), 'الحجم ' + ratio(item.volume),
                           'اختلال الدفتر ' + (item.imbalance?.toFixed(2) ?? '—')]) {
        details.append(Object.assign(document.createElement('div'), {textContent: text}));
      }
      td.append(details);
    }
    fragment.append(row);
  }
  if (!fragment.childNodes.length) {
    const row = document.createElement('tr');
    const td = cell(row, !data ? 'بانتظار البيانات' : query ? 'لا توجد نتائج مطابقة' : 'لا توجد بيانات في هذا القسم بعد', 'empty');
    td.colSpan = headings.length;
    fragment.append(row);
  }
  const body = el('rows');
  const expanded = [...body.rows].filter(row => row.querySelector('details[open]')).map(row => row.dataset.key);
  for (const row of fragment.children) {
    const cells = row.cells;
    if (view === 'watch' || cells.length < 9) continue;
    row.dataset.key = [cells[0].textContent,cells[1].textContent,cells[7].textContent].join('|');
    row.querySelector('details').open = expanded.includes(row.dataset.key);
  }
  body.replaceChildren(fragment);
  el('pager').hidden = view !== 'closed';
  const counts = data?.trades.counts ?? {};
  const pages = Math.max(1, Math.ceil(((counts.tp ?? 0) + (counts.sl ?? 0)) / (data?.trades.page_size ?? 50)));
  el('page').textContent = page + ' / ' + pages;
  el('prev').disabled = page <= 1;
  el('next').disabled = page >= pages;
}
async function refresh() {
  if (busy) return;
  busy = true;
  const requestedPage = page;
  try {
    const response = await fetch('/api/status?page=' + requestedPage, {cache:'no-store', signal:AbortSignal.timeout(6000)});
    if (!response.ok) throw Error(response.status);
    const snapshot = await response.json();
    if (requestedPage !== page) return;
    data = snapshot;
    const {market,trades,time} = data;
    el('watched').textContent = market.symbols.length;
    el('opened').textContent = trades.counts.open ?? 0;
    el('target').textContent = trades.counts.tp ?? 0;
    el('stop').textContent = trades.counts.sl ?? 0;
    el('market').textContent = market.connected ? 'السوق متصل' : 'السوق غير متصل';
    el('market').className = 'pill ' + (market.connected ? 'good' : 'bad');
    el('link').textContent = 'تحديث تلقائي';
    el('link').className = 'pill good';
    el('error').hidden = true;
    el('updated').textContent = 'آخر تحديث للوحة ' + stamp(time);
    render();
  } catch {
    el('error').hidden = false;
    el('link').textContent = 'الاتصال متوقف';
    el('link').className = 'pill bad';
  } finally {
    busy = false;
    if (page !== requestedPage) refresh();
  }
}
document.querySelectorAll('[data-view]').forEach(button => button.onclick = () => {
  view = button.dataset.view;
  document.querySelectorAll('[data-view]').forEach(tab => tab.setAttribute('aria-selected', tab === button));
  el('search').value = '';
  render();
});
el('search').addEventListener('input', render);
el('prev').onclick = () => { page--; refresh(); };
el('next').onclick = () => { page++; refresh(); };
render();
refresh();
setInterval(refresh, 2000);
</script>
</body>
</html>
